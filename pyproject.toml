[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-platform"
version = "0.1.0"
description = "Deterministic, API-first paper trading platform"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
paper-platform = "paper_trading_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

